
# Test-only Postgres for running go test -tags=integration locally.
# Uses port 5433 to avoid colliding with the main stack on 5432.
#
# Usage (via Makefile):
#   docker compose -f docker-compose.test.yml up -d
#   INTEGRATION_TEST_DB=... go test -tags=integration ./...
#   docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: inbetwin-postgres-test
    environment:
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_password
      POSTGRES_DB: social_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # in-memory — fast, destroyed on stop
