global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://api-gateway:8080/health
        labels:
          nfr: availability
          service: api-gateway
          tier: edge
      - targets:
          - http://auth-service:3001/health
        labels:
          nfr: availability
          service: auth-service
          tier: application
      - targets:
          - http://social-service:3002/health
        labels:
          nfr: availability
          service: social-service
          tier: application
      - targets:
          - http://agent-service:3003/health
        labels:
          nfr: availability
          service: agent-service
          tier: application
      - targets:
          - http://rag-service:3004/health
        labels:
          nfr: availability
          service: rag-service
          tier: application
      - targets:
          - http://llm-service:3005/health
        labels:
          nfr: availability
          service: llm-service
          tier: application
      - targets:
          - http://lead-scoring-service:3006/health
        labels:
          nfr: availability
          service: lead-scoring-service
          tier: application
      - targets:
          - http://minio:9000/minio/health/live
        labels:
          nfr: availability
          service: minio
          tier: infrastructure
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
