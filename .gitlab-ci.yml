stages:
  - build
  - deploy

# ─── Shared defaults ──────────────────────────────────────────────────────────
default:
  interruptible: true

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # GitLab Container Registry — auto-populated by GitLab
  IMAGE_PREFIX: ${CI_REGISTRY_IMAGE}

# ─── Build template ───────────────────────────────────────────────────────────
.build:
  stage: build
  image: docker:26-cli
  services:
    - name: docker:26-dind
      alias: docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        --cache-from "${IMAGE_PREFIX}/${SERVICE}:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -f "${DOCKERFILE}" \
        -t "${IMAGE_PREFIX}/${SERVICE}:${CI_COMMIT_SHORT_SHA}" \
        -t "${IMAGE_PREFIX}/${SERVICE}:latest" \
        .
    - docker push "${IMAGE_PREFIX}/${SERVICE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_PREFIX}/${SERVICE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/agent-pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"

# ─── Per-service build jobs ───────────────────────────────────────────────────
build:auth-service:
  extends: .build
  variables:
    SERVICE: auth-service
    DOCKERFILE: auth-service/Dockerfile

build:social-service:
  extends: .build
  variables:
    SERVICE: social-service
    DOCKERFILE: social-service/Dockerfile

build:agent-service:
  extends: .build
  variables:
    SERVICE: agent-service
    DOCKERFILE: agent-service/Dockerfile

build:rag-service:
  extends: .build
  variables:
    SERVICE: rag-service
    DOCKERFILE: rag-service/Dockerfile

build:llm-service:
  extends: .build
  variables:
    SERVICE: llm-service
    DOCKERFILE: llm-service/Dockerfile

build:lead-scoring-service:
  extends: .build
  variables:
    SERVICE: lead-scoring-service
    DOCKERFILE: lead-scoring-service/Dockerfile

build:api-gateway:
  extends: .build
  variables:
    SERVICE: api-gateway
    DOCKERFILE: inbetwin-api-gateway/Dockerfile

# ─── Deploy ───────────────────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  image: alpine:3.19
  environment:
    name: production
    url: https://inbetwin.ru
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - |
      if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
        echo "DEPLOY_SSH_KEY is empty. Check GitLab CI/CD variables and protected-variable scope."
        exit 1
      fi

      if [ -f "$DEPLOY_SSH_KEY" ]; then
        chmod 600 "$DEPLOY_SSH_KEY"
        ssh-add "$DEPLOY_SSH_KEY"
      else
        printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Suppress host key prompt — add server fingerprint as CI variable DEPLOY_HOST_KEY
    - printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
  script:
    - |
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}" -p "${DEPLOY_PORT:-22}" \
        "REGISTRY='${CI_REGISTRY}' REGISTRY_USER='${CI_REGISTRY_USER}' REGISTRY_PASS='${CI_REGISTRY_PASSWORD}' IMAGE_PREFIX='${IMAGE_PREFIX}' IMAGE_TAG='${CI_COMMIT_SHORT_SHA}' DEPLOY_BRANCH='${CI_COMMIT_REF_NAME}' bash -s" << 'REMOTE'
          set -e
          cd /opt/inbetwin

          : "${DEPLOY_BRANCH:?DEPLOY_BRANCH is required}"

          # Pull latest compose / config files from the branch that triggered CI
          git fetch origin "$DEPLOY_BRANCH" && git reset --hard "origin/$DEPLOY_BRANCH"

          # Log in to GitLab Container Registry
          echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

          # Export image vars so docker-compose.prod.yml picks them up
          export IMAGE_PREFIX="$IMAGE_PREFIX"
          export IMAGE_TAG="$IMAGE_TAG"

          # Previous interrupted recreates can leave Compose temp containers named
          # like "db124a033186_inbetwin-redis", which block the next recreate.
          stale_compose_containers="$(
            docker ps -a --format '{{.ID}} {{.Names}}' \
              | awk '$2 ~ /^[0-9a-f]+_inbetwin-/ { print $1 }'
          )"
          if [ -n "$stale_compose_containers" ]; then
            docker rm -f $stale_compose_containers
          fi

          # Pull new images and restart
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-build
          docker compose -f docker-compose.prod.yml restart nginx

          # Clean up dangling images
          docker image prune -f

          echo "✓ Deploy complete — $(date)"
      REMOTE
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/agent-pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"
  needs:
    - build:auth-service
    - build:social-service
    - build:agent-service
    - build:rag-service
    - build:llm-service
    - build:lead-scoring-service
    - build:api-gateway
