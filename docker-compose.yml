services:
  postgres:
    image: postgres:15-alpine
    container_name: inbetwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth_password}
      POSTGRES_DB: ${DB_NAME:-auth_db}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER:-social_user}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:-social_password}
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME:-social_db}
      RAG_DB_USER: ${RAG_DB_USER:-rag_user}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-rag_password}
      RAG_DB_NAME: ${RAG_DB_NAME:-rag_db}
      LLM_DB_USER: ${LLM_DB_USER:-llm_user}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-llm_password}
      LLM_DB_NAME: ${LLM_DB_NAME:-llm_db}
      AGENT_DB_USER: ${AGENT_DB_USER:-agent_user}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent_password}
      AGENT_DB_NAME: ${AGENT_DB_NAME:-agent_db}
      LEADS_DB_USER: ${LEADS_DB_USER:-leads_user}
      LEADS_DB_PASSWORD: ${LEADS_DB_PASSWORD:-leads_password}
      LEADS_DB_NAME: ${LEADS_DB_NAME:-leads_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auth_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inbetwin-network

  redis:
    image: redis:7-alpine
    container_name: inbetwin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inbetwin-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: inbetwin-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: inbetwin
      RABBITMQ_DEFAULT_PASS: inbetwin_password
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inbetwin-network

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: inbetwin-auth-service
    restart: unless-stopped
    environment:
      PORT: "3001"
      ENVIRONMENT: "development"

      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-auth_user}
      DB_PASSWORD: ${DB_PASSWORD:-auth_password}
      DB_NAME: ${DB_NAME:-auth_db}
      DB_SSL_MODE: "disable"

      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-this-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3001/api/v1/auth/oauth/google/callback}

      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URL: ${YANDEX_REDIRECT_URL:-http://localhost:3001/api/v1/auth/oauth/yandex/callback}

      VK_APP_ID_ANDROID: ${VK_APP_ID_ANDROID:-54511649}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Firebase Cloud Messaging (push notifications)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-inbetwin-crm}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-adminsdk.json

    volumes:
      # Mount the Firebase service account key (do NOT commit this file to git)
      - ./secrets/firebase-adminsdk.json:/app/secrets/firebase-adminsdk.json:ro

    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inbetwin-network

  social-service:
    build:
      context: .
      dockerfile: ./social-service/Dockerfile
    container_name: inbetwin-social-service
    restart: unless-stopped
    environment:
      PORT: "3002"
      ENVIRONMENT: "development"

      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${SOCIAL_DB_USER:-social_user}
      DB_PASSWORD: ${SOCIAL_DB_PASSWORD:-social_password}
      DB_NAME: ${SOCIAL_DB_NAME:-social_db}
      DB_SSL_MODE: "disable"

      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-this-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:-0}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:-}

      VK_APP_ID_WEB: ${VK_APP_ID_WEB:-54511648}
      VK_APP_SECRET_WEB: ${VK_APP_SECRET_WEB:-}
      VK_REDIRECT_URI_WEB: ${VK_REDIRECT_URI_WEB:-http://localhost:3002/api/v1/social/vk/oauth/user/callback}
      VK_REDIRECT_URI_GROUP: ${VK_REDIRECT_URI_GROUP:-http://localhost:3002/api/v1/social/vk/oauth/callback}
      VK_APP_ID_ANDROID: ${VK_APP_ID_ANDROID:-54511649}
      VK_APP_SECRET_ANDROID: ${VK_APP_SECRET_ANDROID:-}
      VK_REDIRECT_URI_ANDROID: ${VK_REDIRECT_URI_ANDROID:-vk54511649://vk.ru/blank.html}
      VK_APP_ID_IOS: ${VK_APP_ID_IOS:-54511650}
      VK_APP_SECRET_IOS: ${VK_APP_SECRET_IOS:-}
      VK_REDIRECT_URI_IOS: ${VK_REDIRECT_URI_IOS:-vk54511650://vk.ru/blank.html}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RAG_SERVICE_URL: "http://rag-service:3004"
      LLM_SERVICE_URL: "http://llm-service:3005"
      LLM_ORCHESTRATION_MODE: ${LLM_ORCHESTRATION_MODE:-legacy}

    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - inbetwin-network

  agent-service:
    build:
      context: .
      dockerfile: ./agent-service/Dockerfile
    container_name: inbetwin-agent-service
    restart: unless-stopped
    environment:
      PORT: "3003"
      ENVIRONMENT: "development"

      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${AGENT_DB_USER:-agent_user}
      DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent_password}
      DB_NAME: ${AGENT_DB_NAME:-agent_db}
      DB_SSL_MODE: "disable"

    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inbetwin-network

  rag-service:
    build:
      context: .
      dockerfile: ./rag-service/Dockerfile
    container_name: inbetwin-rag-service
    restart: unless-stopped
    environment:
      PORT: "3004"
      ENVIRONMENT: "development"

      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${RAG_DB_USER:-rag_user}
      DB_PASSWORD: ${RAG_DB_PASSWORD:-rag_password}
      DB_NAME: ${RAG_DB_NAME:-rag_db}
      DB_SSL_MODE: "disable"

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_HOST: ${PINECONE_HOST:-}

      GOOGLE_SHEETS_API_KEY: ${GOOGLE_SHEETS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.70}

      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-inbetwin-rag}
      MINIO_USE_SSL: "false"

    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inbetwin-network

  minio:
    image: minio/minio:latest
    container_name: inbetwin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inbetwin-network

  llm-service:
    build:
      context: .
      dockerfile: ./llm-service/Dockerfile
    container_name: inbetwin-llm-service
    restart: unless-stopped
    environment:
      PORT: "3005"
      ENVIRONMENT: "development"

      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${LLM_DB_USER:-llm_user}
      DB_PASSWORD: ${LLM_DB_PASSWORD:-llm_password}
      DB_NAME: ${LLM_DB_NAME:-llm_db}
      DB_SSL_MODE: "disable"

      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-5}
      HISTORY_SIZE: ${HISTORY_SIZE:-20}

      RAG_SERVICE_URL: "http://rag-service:3004"
      AGENT_SERVICE_URL: "http://agent-service:3003"
      LEAD_SCORING_SERVICE_URL: "http://lead-scoring-service:3006"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      HOT_LEAD_THRESHOLD: ${HOT_LEAD_THRESHOLD:-80}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL_CALENDAR:-http://localhost:3005/llm/google/callback}

    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      lead-scoring-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inbetwin-network

  lead-scoring-service:
    build:
      context: .
      dockerfile: ./lead-scoring-service/Dockerfile
    container_name: inbetwin-lead-scoring-service
    restart: unless-stopped
    environment:
      PORT: "3006"
      ENVIRONMENT: "development"

      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${LEADS_DB_USER:-leads_user}
      DB_PASSWORD: ${LEADS_DB_PASSWORD:-leads_password}
      DB_NAME: ${LEADS_DB_NAME:-leads_db}
      DB_SSL_MODE: "disable"

      HOT_LEAD_THRESHOLD: ${HOT_LEAD_THRESHOLD:-80}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:-}

    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inbetwin-network

  api-gateway:
    build:
      context: .
      dockerfile: ./inbetwin-api-gateway/Dockerfile
    container_name: inbetwin-api-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      ENVIRONMENT: "development"

      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-this-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      AUTH_SERVICE_URL: "http://auth-service:3001"
      SOCIAL_SERVICE_URL: "http://social-service:3002"
      AGENT_SERVICE_URL: "http://agent-service:3003"
      RAG_SERVICE_URL: "http://rag-service:3004"
      LLM_SERVICE_URL: "http://llm-service:3005"
      LEAD_SCORING_SERVICE_URL: "http://lead-scoring-service:3006"

      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"

      RATE_LIMIT_MAX: "50"
      RATE_LIMIT_WINDOW: "10s"

    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
      lead-scoring-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inbetwin-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  inbetwin-network:
    driver: bridge
