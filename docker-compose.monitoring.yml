services:
  prometheus:
    image: prom/prometheus:latest
    container_name: inbetwin-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - blackbox-exporter
      - cadvisor
      - postgres-exporter
      - redis-exporter
      - rabbitmq
    networks:
      - inbetwin-network

  grafana:
    image: grafana/grafana:latest
    container_name: inbetwin-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_METRICS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inbetwin-nfr-evidence.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3007:3000"
    depends_on:
      - prometheus
    networks:
      - inbetwin-network

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: inbetwin-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - inbetwin-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: inbetwin-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - inbetwin-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: inbetwin-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-auth_user}:${DB_PASSWORD:-auth_password}@postgres:5432/${DB_NAME:-auth_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inbetwin-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: inbetwin-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - inbetwin-network

  rabbitmq:
    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

volumes:
  prometheus_data:
  grafana_data:

networks:
  inbetwin-network:
    driver: bridge
